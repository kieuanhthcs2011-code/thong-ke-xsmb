name: Tu Dong Cap Nhat XSMB 19h00 & Deploy Firebase

on:
  schedule:
    # 19:00 GMT+7 = 12:00 UTC; chạy thêm 2 lần dự phòng vì GitHub có thể trễ vài phút
    - cron: '0 12 * * *'
    - cron: '15 12 * * *'
    - cron: '45 12 * * *'
  workflow_dispatch:

concurrency:
  group: xsmb-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Tai ma nguon tu GitHub
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lay KQXS Mien Bac moi nhat
        env:
          XSMB_RSS_URLS: ${{ vars.XSMB_RSS_URLS }}
          XSMB_HISTORY_URLS: ${{ vars.XSMB_HISTORY_URLS }}
          XSMB_HISTORY_PAIRS: ${{ vars.XSMB_HISTORY_PAIRS }}
        run: |
          python update_xsmb.py || echo "Canh bao: Khong lay duoc du lieu mang moi, giu nguyen data.json hien tai"

      - name: Luu data.json moi len GitHub
        id: git_check
        run: |
          git config --local user.email "bot@thongkesxmb.web.app"
          git config --local user.name "ThongkeXSMB Bot"
          git add data.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Cap nhat KQXS tu dong 19h00"
            git pull --rebase origin main || true
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy len Firebase Hosting (thongkesxmb.web.app)
        if: (steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && env.HAS_FIREBASE_SECRET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: thongkesxmb
