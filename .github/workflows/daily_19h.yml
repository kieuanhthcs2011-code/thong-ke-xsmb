name: Tu Dong Cap Nhat XSMB 19h00 & Deploy Firebase

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon tu GitHub
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lay KQXS Mien Bac moi nhat
        run: python update_xsmb.py

      - name: Luu data.json moi len GitHub
        run: |
          git config --local user.email "bot@thongkesxmb.web.app"
          git config --local user.name "ThongkeXSMB Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cap nhat KQXS tu dong 19h00" && git push)

      - name: Deploy len Firebase Hosting (thongkesxmb.web.app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: thongkesxmb
