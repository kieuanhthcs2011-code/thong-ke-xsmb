name: Tu Dong Cap Nhat XSMB 19h00

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-xsmb:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4
      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lay KQXS Mien Bac moi nhat
        run: python update_xsmb.py
      - name: Luu du lieu moi len Web
        run: |
          git config --local user.email "bot@xsmb-auto.local"
          git config --local user.name "XSMB Auto Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cap nhat KQXS tu dong 19h00" && git push)
